[project]
name = "hatchit"
dynamic = ["version"]
description = "Modern Python project scaffolder combining uv and hatch"
readme = "README.md"
authors = [
    { name = "Jayaram Kancherla", email = "jayaram.kancherla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["uv", "copier>=9.0.0"]
keywords = ["scaffold", "uv", "hatch", "project", "generator", "template", "copier", "packaging", "pypi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators"
]

[project.urls]
Homepage = "https://github.com/biocpy/hatchit"
Documentation = "https://biocpy.github.io/hatchit"
Repository = "https://github.com/biocpy/hatchit"
"Bug Tracker" = "https://github.com/biocpy/hatchit/issues"

[project.scripts]
hatchit = "hatchit.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"copier.yml" = "hatchit/copier.yml"
"template" = "hatchit/template"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.ruff]
line-length = 120
src = ["src"]
exclude = ["tests", "docs"]

[tool.ruff.lint]
extend-ignore = ["F821"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "linkify-it-py>=2.1.0",
    "mypy>=2.3.1",
    "myst-nb>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.2",
]
